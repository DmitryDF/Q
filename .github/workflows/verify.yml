# Q — per-push verification.
#
# Runs on EVERY push, not only at the end (O3). Once the repo is public a leak is
# permanent — forks, mirrors, and GitHub's cache — so the scan cannot wait for a
# final checklist. In a private repo you can rewrite history before flipping; after
# flipping you cannot.
#
# The pytest suite is deliberately NOT here until the tests push lands (D9): it
# asserts whole-tree state, so it cannot pass on a partial tree. `verify_kit` plus
# the smoke plus the leak gate are what hold the earlier pushes.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the author-identity check below reads every commit, and a
          # shallow clone would silently pass by seeing only the newest one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the hard dependency
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pyyaml

      - name: Structure
        run: |
          test -f README.md   || { echo "MISSING README.md"; exit 1; }
          test -f LICENSE     || { echo "MISSING LICENSE"; exit 1; }
          test -f NOTICES.md  || { echo "MISSING NOTICES.md — the MIT grant needs its carve-out inventory"; exit 1; }
          test -f INSTALL.md  || { echo "MISSING INSTALL.md"; exit 1; }
          test -f setup.sh    || { echo "MISSING setup.sh"; exit 1; }
          # A shipped CLAUDE.md is a FAILURE, not an omission (O1/A7): an adopter
          # already has one and overwriting it is hostile.
          test ! -f CLAUDE.md || { echo "CLAUDE.md must NOT ship — setup.sh asks instead"; exit 1; }

      - name: The kit's own verifier — the command INSTALL.md tells adopters to run
        run: |
          # It used to FATAL here: verify_kit.py was written for the one-shot
          # builder and required its `kit.manifest.json`, which a release tree does
          # not have. So the command in INSTALL.md step 8 failed on the tree it
          # shipped in, and nothing noticed because CI never ran it. Now it runs on
          # every push, which is the only way that stays true.
          python3 verify_kit.py . --no-explore

      - name: Every gate is syntactically sound
        run: |
          shopt -s nullglob
          fail=0
          for f in .claude/hooks/*.sh; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done
          exit $fail

      - name: Every shipped python module compiles
        run: |
          # The import step below names TWO engines. That is not coverage: a
          # sanitiser bug shipped `hooks/work_done.py` unable to compile at push 19
          # and every build after it stayed green, because nothing looked at the
          # other ~90 modules. `compileall` is the whole-surface check — syntax
          # only, no imports, so it needs none of the optional dependencies.
          python3 -m compileall -q .claude/hooks .claude/skills \
            || { echo "::error::a shipped module does not compile"; exit 1; }
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Engines import — and without the optional extras
        run: |
          shopt -s nullglob
          cd .claude/hooks
          for m in _factcheck_engine bookkeeping_invariant; do
            if [ -f "$m.py" ]; then
              python3 -c "import sys; sys.path.insert(0,'.'); import $m" \
                || { echo "import failed: $m"; exit 1; }
            fi
          done

      - name: The rigor dial — both floors, and no skill naming counts inline
        run: |
          # Guarded on presence: the dial lands at push 4, and this workflow runs
          # from push 0. A missing module is "not shipped yet", not a failure.
          if [ -f .claude/hooks/rigor.py ]; then
            # selftest: every allocation is legal for the engine, every tier
            # still dispatches a binding checker, the fixed pipelines do not move.
            python3 .claude/hooks/rigor.py selftest
            # conformance: the Layer-1 half of a Layer-3 promise. A skill that
            # goes back to naming its own checker counts fails the push — which
            # is the only thing that keeps the install-time setting honest.
            python3 .claude/hooks/rigor.py conformance .claude
          else
            echo "rigor.py not in this release yet — skipping"
          fi

      - name: Leak gate — author identity and private strings
        run: |
          # Narrowed per P0.16: `/Users/` alone matches GENERIC regexes inside guard
          # code that expose nobody, and a gate that can never go green gets disabled.
          #
          # TWO EXCLUSION SETS, for two different reasons:
          #
          #   attribution surfaces  README / NOTICES / LICENSE / INSTALL may name the
          #                         author — NOTICES exists to say "original work by
          #                         <author>". They may NOT name private projects, so
          #                         they are excluded only from the identity grep.
          #
          #   gate files            A FILE WHOSE JOB IS TO DETECT A STRING MUST
          #                         CONTAIN THAT STRING. This workflow carries the
          #                         patterns it greps for; verify_kit.py describes its
          #                         own author-token check. Both are excluded from all
          #                         three greps, or the gate can never pass.
          #
          # The authority for this list is LEAK_ALLOWLIST in the release tool's
          # q_git.py. These two implementations can drift; if you change one, change
          # the other. (Known duplication — the tool is not shipped in this kit.)
          GATE_FILES=(--exclude=verify.yml --exclude=verify_kit.py)
          ATTRIB=(--exclude=README.md --exclude=NOTICES.md
                  --exclude=LICENSE --exclude=INSTALL.md)
          fail=0
          if grep -rniE --exclude-dir=.git "${GATE_FILES[@]}" \
               '/Users/<you>|private_project|chezmoi|private_script|private_source' . ; then
            echo "::error::private strings found"; fail=1
          fi
          if grep -rnE --exclude-dir=.git "${GATE_FILES[@]}" \
               'Knowledge_Base|\bExampleCo\b|EMPLOYER/|config-repo' . ; then
            echo "::error::private directory names found"; fail=1
          fi
          if grep -rniE --exclude-dir=.git "${GATE_FILES[@]}" "${ATTRIB[@]}" \
               '\bmitya\b|\bfrikh|DmitryDF' . ; then
            echo "::error::author identifiers outside the attribution surfaces"; fail=1
          fi
          exit $fail

      - name: The gates are actually wired
        run: |
          # THE WORST DEFECT OF THIS RELEASE shipped for 36 pushes:
          # settings.example.json carried `"hooks": {}` — zero of 142 registrations —
          # so every gate was inert for every adopter while INSTALL claimed otherwise.
          # Checked here because CI is the only layer a manual push cannot skip.
          python3 - <<'PY'
          import json, os, sys
          if not os.path.isfile("settings.example.json"):
              print("no settings.example.json yet (push 0) — skipping"); sys.exit(0)
          hooks_dir = ".claude/hooks"
          if not os.path.isdir(hooks_dir):
              print("no hooks ship yet — skipping"); sys.exit(0)
          reg = (json.load(open("settings.example.json")).get("hooks") or {})
          total = sum(len(e.get("hooks", [])) for v in reg.values()
                      if isinstance(v, list) for e in v)
          scripts = len([f for f in os.listdir(hooks_dir) if f.endswith((".sh", ".py"))])
          print(f"{scripts} hook script(s) ship; {total} registration(s)")
          if total == 0:
              sys.exit("::error::settings.example.json registers ZERO hooks — every gate would be inert")
          # BASENAME of the first token that looks like a hook path. Splitting on the
          # literal "hooks/" matched nothing — shipped commands read
          # `${KIT_HOOKS_DIR}/check-x.sh` — so the check skipped every registration.
          import re
          missing = []
          for v in reg.values():
              if not isinstance(v, list):
                  continue
              for e in v:
                  for h in e.get("hooks", []):
                      m = re.search(r"([\w.\-]+\.(?:sh|py))\b", h.get("command", ""))
                      if m and not os.path.isfile(os.path.join(hooks_dir, m.group(1))):
                          missing.append(m.group(1))
          if missing:
              sys.exit(f"::error::registrations point at hooks that do not ship: {sorted(set(missing))[:5]}")
          print("OK — registrations present, every target ships")
          PY

      - name: No tooling the release does not contain
        run: |
          # `.claude/bin` ships nothing, yet the tree once named `claude-promote` 119
          # times, `claude-verify` 57, `claude-experiment` 38 — telling an adopter to
          # run commands only the author has. The build generalises them; this refuses
          # a tree where one came back.
          if grep -rnE --exclude-dir=.git --exclude=verify.yml --exclude=verify_kit.py \
               'claude-promote|claude-verify|claude-experiment|claude-divergence-check|chezmoi' . ; then
            echo "::error::a shipped file names deploy tooling that is not in this release"
            exit 1
          fi
          echo "OK"

      - name: The engine's rules mirror ships with it
        run: |
          # /double-check raised RuntimeError for any adopter with pydantic installed:
          # its audit-marker path asserts DC_AXIS_REGISTRY against
          # rules/double-check-allocation.md, and a MISSING mirror counts as drift.
          # The mirror was never in the register.
          if [ -f .claude/hooks/_factcheck_engine.py ]; then
            test -f .claude/rules/double-check-allocation.md \
              || { echo "::error::the engine ships without the mirror it asserts"; exit 1; }
            python3 - <<'PY'
          import sys
          sys.path.insert(0, ".claude/hooks")
          import _factcheck_engine as fc
          d = fc.check_allocation_drift(rules_path="/".join([".claude", "rules", "double-check-allocation.md"]))
          if d:
              sys.exit("::error::DC allocation drift: " + "; ".join(d)[:300])
          print(f"OK — {len(fc.DC_AXIS_REGISTRY)} artifact types, mirror consistent")
          PY
          else
            echo "engine not in this release yet — skipping"
          fi

      - name: Withheld and author-only content stays out
        run: |
          # /prioritize is withheld by owner decision; the strip is a build transform,
          # so a register edit or a transform bug could ship it again silently.
          # --exclude=verify.yml: THIS FILE CARRIES THE PATTERNS IT GREPS FOR. Fifth
          # instance of that class in this release — the leak gate hit it on its first
          # real run, verify_kit.py hit it, the CI leak grep hit it twice. Without the
          # exclusion the gate reports itself and can never pass.
          if grep -rnE --exclude-dir=.git --exclude=verify.yml \
               'PRIORITIZE_STATE_DIR|prioritize_advance|prioritize-start|PRIORITIZE_CADENCE_DAYS' . ; then
            echo "::error::the withheld /prioritize subsystem is present"; exit 1
          fi
          # Development scaffolding is not a shipped test.
          fail=0
          for f in probe_commit_styles.sh smoke_verify_then_land_deploy.sh \
                   smoke_auto_registration_e2e.py mutate_publish_scope.py \
                   _live_corpus.py plan_env.sh; do
            if [ -f ".claude/hooks/tests/$f" ]; then
              echo "::error::author-side probe shipped: $f"; fail=1
            fi
          done
          exit $fail

      - name: Commit identity (D11) — the one leak no content scan can see
        run: |
          # Irreversible once public, so it is checked on every push rather than once.
          bad="$(git log --format='%an <%ae>' | sort -u | grep -v 'users.noreply.github.com' || true)"
          if [ -n "$bad" ]; then
            echo "::error::commits carry a non-noreply identity:"; echo "$bad"; exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default ruleset plus one narrow, documented allowlist. Named
          # explicitly rather than relying on auto-detection, so a rename of the
          # file fails loudly instead of silently reverting to bare defaults —
          # which would re-fail the push it was added for.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Install smoke — into a sandbox, never the runner's real config
        run: |
          mkdir -p /tmp/q-sandbox
          printf '# pre-existing user rules\n' > /tmp/q-sandbox/CLAUDE.md
          ASSUME_NO=1 CLAUDE_CONFIG_DIR=/tmp/q-sandbox ./setup.sh --global
          # ASSUME_NO: the consent step must not block CI on stdin, and must not
          # write to a file it was not given permission to touch.
          grep -q '@rules/' /tmp/q-sandbox/CLAUDE.md \
            && { echo "setup.sh wrote to CLAUDE.md without consent"; exit 1; }
          test -d /tmp/q-sandbox/skills || { echo "setup.sh installed nothing"; exit 1; }
          echo "install smoke OK — files landed, CLAUDE.md untouched"

      - name: Settings smoke — the rigor tier is changeable after install
        run: |
          # The operator's second requirement: change the tier on a LIVE install,
          # with no reinstall. If this ever stops working the dial is back to
          # being an install-time-only choice, which is most of the way back to
          # being a claim.
          if [ ! -f /tmp/q-sandbox/hooks/rigor.py ]; then
            echo "rigor.py not in this release yet — skipping"; exit 0
          fi
          Q_RIGOR_TIER=minimal CLAUDE_CONFIG_DIR=/tmp/q-sandbox ./setup.sh --settings --global
          grep -q '"tier": "minimal"' /tmp/q-sandbox/q-rigor.json \
            || { echo "--settings did not store the tier"; exit 1; }
          got="$(python3 /tmp/q-sandbox/hooks/rigor.py for gate)"
          test "$got" = "--sonnet 1" \
            || { echo "gate resolved to '$got', not the minimal tier's allocation"; exit 1; }
          echo "settings smoke OK — tier stored and read back at dispatch"
